      .text-sub { font-family: 'Times New Roman', Times, serif; font-size: 15px; font-weight: bold; fill: #cba343; letter-spacing: 0.1em; }
    </style>
  </defs>

  <!-- Crown Dots -->
  <circle cx="15" cy="18" r="2.5" class="gold" />
  <circle cx="28" cy="12" r="2.5" class="gold" />
  <circle cx="42.5" cy="8" r="2.5" class="gold" />
  <circle cx="57" cy="12" r="2.5" class="gold" />
  <circle cx="70" cy="18" r="2.5" class="gold" />

